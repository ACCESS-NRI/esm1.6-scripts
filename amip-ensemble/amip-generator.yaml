start_point: "77eb941dedcb69a0fd5c97854bddad80327e3414" # release-amip 1.0
test_path: amip-ensemble # All control and perturbation experiment repositories will be created here; can be relative, absolute or ~ (user-defined)
repository_directory: amip # Local directory name for the central repository (user-defined)

control_branch_name: template-amip-1.0

# this block of changes is applied to all branches
Control_Experiment:
  config.yaml: 
    sync:
      base_path:  /g/data/p73/archive/CMIP7/ACCESS-ESM1-6/production/amip
      enable: False
    restart_freq: 1YS
    project: p66
    shortpath: /scratch/p66/
  metadata.yaml:
    url: https://github.com/ACCESS-NRI/access-esm1.6-experiments
    long_description: |-
      ACCESS-ESM1.6 global atmosphere-land model configuration running in co2 concentration driven mode under historical forcings. Historical forcing data including atmospheric co2 concentrations, sea surface temperatures, and sea ice concentrations are primarily sourced from the input4MIPs CMIP7 datasets.
    frequency:
      - fx
      - 1yr
      - 1mon
      - 1day
      - 6hr
      - 3hr
      - 1hr


