[template variables]
PROJECT = "tm70"
QUEUE = "normalbw"
# Need hr22 for cylc module, vk83 for payu module, then wherever the data is
STORAGE = "gdata/hr22+gdata/vk83+gdata/xp65+gdata/tm70+scratch/tm70"
REALMS = "atmosphere", "ice", "ocean"

# If not using the launch.suite.sh script need to specify the directory of the data
DATASET_DIR = "/PATH/TO/DATASET"

# Number of outputX to run at a time
# 1 for testing, increase to say 20?
RUNAHEAD_LIMIT = 1
# Limit to number of simulataneous PBS jobs
# 2 for testing, increase to, say, 10?
PBS_LIMIT = 6

# Delete the old netCDF files once the new ones are created
# Otherwise old netCDF files will be archived in
#   $DATASET_DIR/output???/$REALM/old_data_archive
DELETE_OLD_DATA = True
